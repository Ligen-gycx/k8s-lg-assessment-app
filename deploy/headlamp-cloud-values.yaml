replicaCount: 1

config:
  inCluster: true
  inClusterContextName: main
  baseURL: /headlamp
  sessionTTL: 3600
  oidc:
    secret:
      create: false

# The Dashboard only needs read-only access for this assessment.
clusterRoleBinding:
  create: true
  clusterRoleName: view

service:
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
