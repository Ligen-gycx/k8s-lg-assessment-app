# VM lab override: images are imported into each worker node's containerd.
frontend:
  image: docker.io/library/assessment-web
  tag: 344d71a
  replicas: 1
  nodeSelector:
    assessment.ligen.io/role: ingress
backend:
  image: docker.io/library/assessment-api
  tag: 344d71a
  replicas: 2
  nodeSelector:
    assessment.ligen.io/workload: "true"
  podAntiAffinity: true
ingress:
  host: app.192.168.2.8.nip.io
