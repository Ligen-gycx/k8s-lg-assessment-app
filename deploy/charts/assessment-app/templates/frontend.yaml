apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-web
  labels: {{- include "assessment.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: assessment-web }
  template:
    metadata:
      labels: { app: assessment-web }
    spec:
      automountServiceAccountToken: false
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101 }
      containers:
        - name: web
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: {{ .Values.frontend.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          resources: {{- toYaml .Values.resources.frontend | nindent 12 }}
          readinessProbe: { httpGet: { path: /, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: assessment-web }
spec:
  selector: { app: assessment-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: assessment-web }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: assessment-web, port: { name: http } } }
    # VM lab fallback: supports direct private-IP access when a browser proxy bypasses nip.io.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: assessment-web, port: { name: http } } }
