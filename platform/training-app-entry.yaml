apiVersion: v1
kind: Namespace
metadata: { name: spring-app }
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: spring-app-postgresql-pv }
spec:
  capacity: { storage: 2Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  nfs: { server: 192.168.2.7, path: /srv/k8s-nfs/spring-postgresql }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgresql-data, namespace: spring-app }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-static
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgresql, namespace: spring-app }
spec:
  serviceName: postgresql
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgresql } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgresql } }
    spec:
      nodeSelector: { assessment.ligen.io/workload: "true" }
      securityContext: { fsGroup: 999 }
      containers:
        - name: postgresql
          image: docker.m.daocloud.io/library/postgres:17-bookworm
          securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999 }
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: assessment }
            - { name: POSTGRES_USER, value: assessment }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-db, key: password } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { exec: { command: [sh, -c, pg_isready -U assessment -d assessment] }, initialDelaySeconds: 10 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgresql-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgresql, namespace: spring-app }
spec:
  selector: { app.kubernetes.io/name: postgresql }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: spring-app, namespace: spring-app }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector: { matchLabels: { app.kubernetes.io/name: spring-app } }
  template:
    metadata: { labels: { app.kubernetes.io/name: spring-app } }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { assessment.ligen.io/workload: "true" }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app.kubernetes.io/name: spring-app } }
              topologyKey: kubernetes.io/hostname
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: spring-app
          image: docker.io/library/assessment-api:344d71a
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: DATABASE_URL, value: jdbc:postgresql://postgresql:5432/assessment }
            - { name: DATABASE_USERNAME, value: assessment }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=50.0" }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: app-db, key: password } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          startupProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 120, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 120 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, timeoutSeconds: 5, failureThreshold: 6 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: spring-app, namespace: spring-app }
spec:
  selector: { app.kubernetes.io/name: spring-app }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: spring-web, namespace: spring-app }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: spring-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: spring-web } }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { assessment.ligen.io/role: ingress }
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101 }
      containers:
        - name: web
          image: docker.m.daocloud.io/nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: web-root, mountPath: /usr/share/nginx/html/index.html, subPath: index.html, readOnly: true }
            - { name: web-assets, mountPath: /usr/share/nginx/html/assets, readOnly: true }
            - { name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: web-root, configMap: { name: spring-web-root } }
        - { name: web-assets, configMap: { name: spring-web-assets } }
        - { name: nginx, configMap: { name: spring-web-nginx } }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: spring-web, namespace: spring-app }
spec:
  selector: { app.kubernetes.io/name: spring-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: spring-app, namespace: spring-app }
spec:
  ingressClassName: traefik
  tls:
    - hosts: [app.k8s.lab]
      secretName: k8s-lab-tls
  rules:
    - host: app.k8s.lab
      http:
        paths:
          - path: /actuator
            pathType: Prefix
            backend: { service: { name: spring-app, port: { number: 8080 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: spring-app, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: spring-web, port: { number: 80 } } }
