apiVersion: apps/v1
kind: Deployment
metadata: { name: assessment-api, namespace: assessment }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector: { matchLabels: { app: assessment-api } }
  template:
    metadata: { labels: { app: assessment-api } }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { assessment.ligen.io/workload: "true" }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: assessment-api } }
              topologyKey: kubernetes.io/hostname
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: api
          image: docker.io/library/assessment-api:344d71a
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: DATABASE_URL, value: jdbc:postgresql://postgresql:5432/assessment }
            - { name: DATABASE_USERNAME, value: assessment }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: assessment-db, key: password } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          startupProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 120 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, timeoutSeconds: 5, failureThreshold: 6 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: assessment-api, namespace: assessment }
spec:
  selector: { app: assessment-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: assessment-web, namespace: assessment }
spec:
  replicas: 1
  selector: { matchLabels: { app: assessment-web } }
  template:
    metadata: { labels: { app: assessment-web } }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { assessment.ligen.io/role: ingress }
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101 }
      containers:
        - name: web
          image: docker.m.daocloud.io/nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: web-root, mountPath: /usr/share/nginx/html/index.html, subPath: index.html, readOnly: true }
            - { name: web-assets, mountPath: /usr/share/nginx/html/assets, readOnly: true }
            - { name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: web-root, configMap: { name: assessment-web-root } }
        - { name: web-assets, configMap: { name: assessment-web-assets } }
        - { name: nginx, configMap: { name: assessment-web-nginx } }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: assessment-web, namespace: assessment }
spec:
  selector: { app: assessment-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: assessment-web, namespace: assessment }
spec:
  ingressClassName: traefik
  rules:
    - host: app.192.168.2.8.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: assessment-web, port: { name: http } } }
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: assessment-web, port: { name: http } } }
