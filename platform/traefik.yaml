apiVersion: v1
kind: Namespace
metadata: { name: ingress-system }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: traefik, namespace: ingress-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: traefik-ingress-reader }
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: traefik-ingress-reader }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: traefik-ingress-reader }
subjects: [{ kind: ServiceAccount, name: traefik, namespace: ingress-system }]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: { name: traefik }
spec: { controller: traefik.io/ingress-controller }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: traefik, namespace: ingress-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: traefik } }
  template:
    metadata: { labels: { app: traefik } }
    spec:
      serviceAccountName: traefik
      nodeSelector: { assessment.ligen.io/role: ingress }
      containers:
        - name: traefik
          image: docker.m.daocloud.io/library/traefik:v3.3
          args: [--providers.kubernetesingress, --providers.kubernetesingress.ingressclass=traefik, --entrypoints.web.address=:8000, --api.dashboard=false, --ping=true]
          ports: [{ name: web, containerPort: 8000 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
          readinessProbe: { tcpSocket: { port: web }, initialDelaySeconds: 5 }
          livenessProbe: { tcpSocket: { port: web }, initialDelaySeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 65532, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: traefik, namespace: ingress-system }
spec:
  type: NodePort
  selector: { app: traefik }
  ports: [{ name: web, port: 80, targetPort: web, nodePort: 30080 }]
