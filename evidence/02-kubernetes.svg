<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><rect width="1600" height="850" fill="#0d1117"/><rect width="1600" height="66" fill="#161b22"/><text x="32" y="42" fill="#f0f6fc" font-family="Arial" font-size="24" font-weight="700">02. Kubernetes nodes and Calico VXLAN</text><circle cx="1512" cy="33" r="9" fill="#3fb950"/><text x="1530" y="39" fill="#3fb950" font-family="Arial" font-size="16">VERIFIED</text><g font-family="Menlo, Monaco, monospace" font-size="20" fill="#c9d1d9"><text x="34" y="110"><tspan fill="#3fb950">ubuntu@k8s-lg-master:~$</tspan><tspan fill="#79c0ff"> kubectl get nodes -o wide</tspan></text><text x="34" y="155">NAME            STATUS   ROLES           VERSION   INTERNAL-IP   CONTAINER-RUNTIME</text><text x="34" y="195">k8s-lg-master   Ready    control-plane   v1.36.4   192.168.2.4   containerd://2.2.1</text><text x="34" y="235">k8s-lg-node1    Ready    &lt;none&gt;          v1.36.4   192.168.2.5   containerd://2.2.1</text><text x="34" y="275">k8s-lg-node2    Ready    &lt;none&gt;          v1.36.4   192.168.2.6   containerd://2.2.1</text><text x="34" y="345"><tspan fill="#3fb950">ubuntu@k8s-lg-master:~$</tspan><tspan fill="#79c0ff"> kubectl -n kube-system get pods -l k8s-app=calico-node</tspan></text><text x="34" y="390">NAME                READY   STATUS    NODE</text><text x="34" y="430">calico-node-468fc   1/1     Running   k8s-lg-master</text><text x="34" y="470">calico-node-86nsm   1/1     Running   k8s-lg-node1</text><text x="34" y="510">calico-node-jddkp   1/1     Running   k8s-lg-node2</text><text x="34" y="580"><tspan fill="#3fb950">ubuntu@k8s-lg-master:~$</tspan><tspan fill="#79c0ff"> kubectl get ippools.crd.projectcalico.org</tspan></text><text x="34" y="625">NAME                  CIDR            IPIP    VXLAN</text><text x="34" y="665">default-ipv4-ippool   10.244.0.0/16   Never   Always</text></g></svg>
