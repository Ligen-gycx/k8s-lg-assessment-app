<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><rect width="1600" height="780" fill="#0d1117"/><rect width="1600" height="66" fill="#161b22"/><text x="32" y="42" fill="#f0f6fc" font-family="Arial" font-size="24" font-weight="700">03. NFS and PostgreSQL persistence</text><circle cx="1512" cy="33" r="9" fill="#3fb950"/><text x="1530" y="39" fill="#3fb950" font-family="Arial" font-size="16">VERIFIED</text><g font-family="Menlo, Monaco, monospace" font-size="20" fill="#c9d1d9"><text x="34" y="110"><tspan fill="#3fb950">ubuntu@k8s-lg-master:~$</tspan><tspan fill="#79c0ff"> kubectl -n assessment get pods,pvc,svc</tspan></text><text x="34" y="160">NAME               READY   STATUS    RESTARTS</text><text x="34" y="200">pod/postgresql-0   1/1     Running   0</text><text x="34" y="275">NAME                                    STATUS   VOLUME                     CAPACITY   STORAGECLASS</text><text x="34" y="315">persistentvolumeclaim/postgresql-data   Bound    assessment-postgresql-pv   4Gi        nfs-static</text><text x="34" y="390">NAME                 TYPE        CLUSTER-IP    PORT(S)</text><text x="34" y="430">service/postgresql   ClusterIP   10.99.23.63   5432/TCP</text><text x="34" y="505"><tspan fill="#3fb950">ubuntu@k8s-lg-master:~$</tspan><tspan fill="#79c0ff"> exportfs -v</tspan></text><text x="34" y="550">/srv/k8s-nfs  192.168.2.0/24(rw,sync,no_subtree_check,no_root_squash)</text></g></svg>
